name: Update README Release Version

on:
  release:
    types: [ published ]

permissions:
  contents: write

concurrency:
  group: update-readme-release-version
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: main

    - name: Update dependency version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: python3 .github/scripts/update_readme_version.py "$RELEASE_TAG"

    - name: Commit README update
      run: |
        if git diff --quiet -- README.md; then
          echo "README already has the current version."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update README release version"
        git push origin HEAD:main
